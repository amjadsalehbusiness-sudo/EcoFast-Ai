<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoFast AI | Fast & Affordable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .gold-text { color: #FFD700; }
        .bg-gold { background-color: #FFD700; color: #000; }
    </style>
</head>
<body class="p-8">
    <header class="flex justify-between items-center border-b border-gray-800 pb-4">
        <h1 class="text-3xl font-bold gold-text">EcoFast AI</h1>
        <nav>
            <span class="mr-4">Dashboard</span>
            <button class="bg-gold px-4 py-1 rounded font-bold">Add Credits</button>
        </nav>
    </header>
    <main class="mt-10">
        <h2 class="text-2xl mb-6">Welcome to your Dashboard</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="border border-gray-700 p-6 rounded-lg text-center">
                <h3 class="text-xl font-bold">Generate Image</h3>
                <button class="bg-gold w-full py-2 mt-4 rounded font-bold">Create Now</button>
            </div>
            <div class="border border-gray-700 p-6 rounded-lg text-center">
                <h3 class="text-xl font-bold">Generate Video</h3>
                <button class="bg-gold w-full py-2 mt-4 rounded font-bold">Create Now</button>
            </div>
            <div class="border border-gray-700 p-6 rounded-lg text-center">
                <h3 class="text-xl font-bold">Wallet</h3>
                <p class="text-gray-400 my-4">Balance: 13 Credits</p>
            </div>
        </div>
    </main>
</body>
</html>
